<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;">
    <title>EcoRide - Connexion</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/mediaquerise_base.css">
    <link rel="stylesheet" href="/css/connexion-inscription.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <!-- Je récupère des icons sur google front -->
    <script src="/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/jquery-3.7.1.min.js" defer></script>


</head>

<body>

  <header>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/HTML/EcoRide_Accueil.html">
                <img src="/Image/EcoRide.svg" alt="logo EcoRide" class="logo">
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav ms-auto align-items-center">
                    <a class="nav-link" href="/HTML/EcoRide_Accueil.html">Accueil</a>
                    <a class="nav-link" href="/HTML/resultat.html">Covoiturage</a>
                    <a class="nav-link" href="/HTML/connexion.html">Connexion</a>
                    <a class="nav-link" href="/HTML/contact.html">Contact</a>
                    <!-- Mon compte avec menu déroulant pour l'utilisateur connecté -->
                    <div class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle btn-mon-compte" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Mon compte
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="navbarDropdown">
                            <li class="dropdown-item-text text-center border-bottom pb-2 mb-2">
                                <span class="badge bg-success py-2 px-3">20 Crédits</span>
                            </li>
                            <li><a class="dropdown-item" href="/HTML/Espace_utilisateur.html">Accéder au profil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item text-danger" href="#">Déconnexion</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

    <main>
        <div class="container-fluid px-4">
            <div class="row gx-5 justify-content-evenly">
                <div class="col-12 col-md-6 col-lg-5 formulaires_connexion">
                    <!-- Formulaire de connexion -->
                    <form id="connexion-form" method="post">
                        <fieldset class="fieldset-connexion">
                            <legend>Connexion</legend>
                            <div class="connexion" id="email-div">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="connexion" id="password-div">
                                <label for="password">Mot de passe</label>
                                <input type="password" id="password" name="password" required>
                            </div>
                            <div class="connexion">
                                <label class="checkbox">
                                    <!-- Ici pas de for parceque la checkbox est a l'intérieur du label -->
                                    <input type="checkbox" name="restez-connecte">
                                    Restez connecté
                                </label>
                            </div>
                            <div>
                                <button type="submit" id="btnConnexion" class="btn btn-primary">Connexion</button>
                            </div>
                            <div>
                                <button class="motDePasseOublie" type="button"
                                    onclick="location.href='mot-de-passe-mot-de-passe-oublie.html'">Mot de passe
                                    oublié</button>
                            </div>
                        </fieldset>
                    </form>
                </div>
            </div>
        </div>
    </main>
  <footer>
        <!-- Pied de page avec informations de contact -->
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl text-center">
                    <a href="mailto:EcoRide@hotmail.com" class="contact-mail">EcoRide@hotmail.com</a>
                </div>
                <div class="col-xl text-center">
                    <a href="" class="mentions-legales">Mention légales</a>
                </div>
                <div class="col-xl text-center">
                    <a href="" class="reseaux-sociaux">Réseaux sociaux</a>
                </div>
            </div>
        </div>
    </footer>
    <script src="/js/connexion.js" defer></script>
</body>

</html>
