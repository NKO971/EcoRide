<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRide - Administration</title>
    
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/mediaquerise_base.css">
</head>

<header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="/Image/EcoRide.svg" alt="Logo EcoRide" class="me-2">
                 <span class="badge bg-danger ms-2" style="font-size: 0.5em;">ADMIN</span>
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#adminNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="adminNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/">Voir le site</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-light btn-sm ms-lg-3 mt-2 mt-lg-0" href="#">Déconnexion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</header>
<!-- Statistiques journalier -->
<main class="container my-5">
    <div class="row mb-4">
        <div class="col">
            <h1 class="h2 border-bottom pb-2">Tableau de bord</h1>
        </div>
    </div>

    <div class="row g-4">
        
        <div class="col-12 col-lg-7">
            <div class="card shadow-sm h-100">
                <div class="card-header bg-white">
                    <h5 class="card-title mb-0">Fréquentation des covoiturages</h5>
                </div>
                <div class="card-body">
                    <canvas id="chart-trajets" height="200"></canvas>
                </div>
            </div>
        </div>

        <div class="col-12 col-lg-5">
            <div class="card shadow-sm h-100 border-success">
                <div class="card-header bg-success text-white">
                    <h5 class="card-title mb-0">Revenus de la plateforme</h5>
                </div>
                <div class="card-body d-flex flex-column justify-content-between">
                    <div class="text-center py-3">
                        <p class="text-muted mb-1">Total accumulé</p>
                        <h2 class="display-4 fw-bold text-success"><span id="total-credits">0</span>crédits</h2>
                    </div>
                    <canvas id="chart-credits" height="150"></canvas>
                </div>
            </div>
        </div>

    </div>
<!--  Gestion des comptes -->
    <section class="mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Gestion des comptes</h5>
            <div class="input-group input-group-sm w-25">
                <input type="text" class="form-control" placeholder="Rechercher un pseudo..." id="search-user">
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Pseudo</th>
                            <th>Rôle</th>
                            <th>Statut</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="liste-utilisateurs">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
<!-- Création des copmtes employé -->
<section class="mt-5 mb-5">
    <div class="row">
        <div class="col-lg-6 mx-auto">
            <div class="card shadow-sm border-primary">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Créer un nouveau compte employé</h5>
                </div>
                <div class="card-body">
                    <form id="form-creation-employe">
                        <div class="mb-3">
                            <label for="emp-nom" class="form-label">Nom complet</label>
                            <input type="text" class="form-control" id="emp-nom" required>
                        </div>
                        <div class="mb-3">
                            <label for="emp-email" class="form-label">Adresse Email</label>
                            <input type="email" class="form-control" id="emp-email" required>
                        </div>
                        <div class="mb-3">
                            <label for="emp-password" class="form-label">Mot de passe provisoire</label>
                            <input type="password" class="form-control" id="emp-password" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Enregistrer l'employé</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</main>
