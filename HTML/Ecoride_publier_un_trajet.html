<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRide - Trajet</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/mediaquerise_base.css">
    <link rel="stylesheet" href="/css/publier-un-trajet.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/jquery-3.7.1.min.js" defer></script>
    <!-- Je récupère des icons sur google front -->

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <!-- Logo -->
                <a class="navbar-brand" href="/HTML/EcoRide_Accueil.html">
                    <img src="/Image/EcoRide.svg" alt="logo EcoRide" class="logo">
                </a>

                <!-- Bouton hamburger mobile -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu navigation -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/HTML/EcoRide_Accueil.html">Accueil</a>
                        <a class="nav-link" href="/HTML/Connexion-inscription.html">Connexion/Inscription</a>
                        <a class="nav-link" href="/HTML/Ecoride_publier_un_trajet.html">Publier un trajet</a>
                        <a class="nav-link" href="/HTML/contact.html">Contact</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        
            <div class="col-4">
                   <!-- Dans l'attribut action placer (une URL) où doivent être envoyés les données provenant du formulaire.-->
              <form action="" method="post">
    <fieldset>
        <legend>Publier un trajet</legend>

        <div class="form-group">
            <label for="lieu_depart" class="visually-hidden">Ville de départ</label>
            <input type="text" id="lieu_depart" name="lieu_depart" placeholder="Ville de départ" required>
        </div>

        <div class="form-group">
            <label for="lieu_arrivee" class="visually-hidden">Ville d'arrivée</label>
            <input type="text" id="lieu_arrivee" name="lieu_arrivee" placeholder="Ville d'arrivée" required>
        </div>

        <div class="row">
            <div class="col-12 col-md-6">
                <label for="date_depart">Date de départ</label>
                <input type="date" id="date_depart" name="date_depart" class="form-control" required>
            </div>
            <div class="col-12 col-md-6">
                <label for="heure_depart">Heure de départ</label>
                <input type="time" id="heure_depart" name="heure_depart" class="form-control" required>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-12 col-md-6">
                <label for="date_arrivee">Date d'arrivée</label>
                <input type="date" id="date_arrivee" name="date_arrivee" class="form-control" required>
            </div>
            <div class="col-12 col-md-6">
                <label for="heure_arrivee">Heure d'arrivée</label>
                <input type="time" id="heure_arrivee" name="heure_arrivee" class="form-control" required>
            </div>
        </div>

        <div class="form-group mt-3">
            <label for="nb_place" class="visually-hidden">Nombre de places</label>
            <input type="number" id="nb_place" name="nb_place" min="1" max="6" placeholder="Nombre de places" required>
        </div>

        <div class="form-group">
            <label for="prix_personne" class="visually-hidden">Prix en euros</label>
            <input type="number" id="prix_personne" name="prix_personne" step="0.01" placeholder="Prix en €" required>
        </div>
<!-- Bouton pour publier le trajet -->
        <button type="submit" class="publier-btn">Publier</button>
    </fieldset>
</form>
            </div>
            <div class="col-8">
                <div class="image-container">
                    <img class="image" src="/Image/7178884.jpg" alt="Image d'illustration" class="illustration-image">
                </div>
            </div>
            <!-- <img src="/Image/7178884.jpg" alt="Image d'illustration" class="illustration-image"> -->
    </main>

    <footer>
        <!-- Pied de page avec informations de contact -->
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl text-center">
                    <a href="mailto:EcoRide@hotmail.com" class="contact-mail">EcoRide@hotmail.com</a>
                </div>
                <div class="col-xl text-center">
                    <a href="" class="mentions-legales">Mention légales</a>
                </div>
                <div class="col-xl text-center">
                    <a href="" class="reseaux-sociaux">Réseaux sociaux</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
