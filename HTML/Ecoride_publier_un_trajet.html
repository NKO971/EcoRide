<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoRide - Trajet</title>
    <link rel="stylesheet" href="/css/bootstrap.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/mediaquerise_base.css">
    <link rel="stylesheet" href="/css/publier-un-trajet.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <script src="/js/bootstrap.bundle.min.js" defer></script>
    <script src="/js/jquery-3.7.1.min.js" defer></script>
    <!-- Je récupère des icons sur google front -->

</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <!-- Logo -->
                <a class="navbar-brand" href="/HTML/EcoRide_Accueil.html">
                    <img src="/Image/EcoRide.svg" alt="logo EcoRide" class="logo">
                </a>

                <!-- Bouton hamburger mobile -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menu navigation -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link" href="/HTML/EcoRide_Accueil.html">Accueil</a>
                        <a class="nav-link" href="/HTML/Connexion-inscription.html">Connexion/Inscription</a>
                        <a class="nav-link" href="/HTML/Ecoride_publier_un_trajet.html">Publier un trajet</a>
                        <a class="nav-link" href="/HTML/contact.html">Contact</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="row">
            <div class="col-4">
                <form action="" method="get">
                    <!-- Dans l'attribut action placer (une URL) où doivent être envoyés les données provenant du formulaire.-->
                    <fieldset>
                        <legend>Publier un trajet</legend>
                        <div class="form-group">
                            <label for="depart"></label>
                            <span class="material-symbols-outlined">edit</span>
                            <input type="test" id="depart" name="depart" placeholder="Ville de départ" required>
                        </div>
                       
                        <div class="form-group">
                            <label for="arrivee"></label>
                            <span class="material-symbols-outlined">edit</span>
                            <input type="text" id="arrivee" name="arrivee" placeholder="Ville d'arrivée" required>
                        </div>
                       
                        <div class="col-12 col-md-4 col-lg-6">
                            <label for="dateTrajet" class="visually-hidden">Date du trajet</label>
                            <input type="date" id="dateTrajet" name="dateTrajet" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="passagers"></label>
                            <input type="number" id="passagers" name="passagers" min="1" max="6" placeholder="Passagers"
                                required>
                        </div>
                       
                        <div class="form-group">
                            <label for="prix"></label>
                            <input type="number" id="prix" name="prix" placeholder="Prix en €" required>
                        </div>
                       
                        <!-- Bouton pour publier le trajt -->
                        <button type="submit" class="publier-btn">Publier</button>
                    </fieldset>
                </form>
            </div>
            <div class="col-8">
                <div class="image-container">
                    <img class="image" src="/Image/7178884.jpg" alt="Image d'illustration" class="illustration-image">
                </div>
            </div>
            <!-- <img src="/Image/7178884.jpg" alt="Image d'illustration" class="illustration-image"> -->
    </main>

    <footer>
        <!-- Pied de page avec informations de contact -->
        <div class="container-fluid">
            <div class="row">
                <div class="col-xl text-center">
                    <a href="mailto:EcoRide@hotmail.com" class="contact-mail">EcoRide@hotmail.com</a>
                </div>
                <div class="col-xl text-center">
                    <a href="" class="mentions-legales">Mention légales</a>
                </div>
                <div class="col-xl text-center">
                    <a href="" class="reseaux-sociaux">Réseaux sociaux</a>
                </div>
            </div>
        </div>
    </footer>
</body>

</html>
